stages:
  - test
  - deploy
  - notify

ci_checks:
  stage: test
  image: node:22-alpine
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - |
      set +e

      total=0
      passed=0
      failed=0

      check_file() {
        total=$((total + 1))
        if [ -f "$1" ]; then
          echo "PASS file exists: $1"
          passed=$((passed + 1))
        else
          echo "FAIL missing file: $1"
          failed=$((failed + 1))
        fi
      }

      check_file "index.html"
      check_file "script.js"
      check_file "styles/main.css"
      check_file "gameDino.html"
      check_file "gameSnake.html"
      check_file "gameFB.html"
      check_file "gameofLife.html"
      check_file "gameSnakeUnlim.html"
      check_file "GameDino/gameDino.js"
      check_file "GameSnake/gameSnake.js"
      check_file "GameFlappyBird/gameFB.js"
      check_file "GameOfLife/gameofLife.js"
      check_file "GameSnakeUnlimited/gameSnakeUnlim.js"

      for file in $(find . -maxdepth 1 -type f -name "*.html" | sort); do
        total=$((total + 1))
        base="$(basename "$file" .html)"
        log_file="html-validate-${base}.log"

        echo "Validate HTML: $file"
        npx --yes html-validate@11.2.0 "$file" > "$log_file" 2>&1
        result=$?

        if [ "$result" -eq 0 ]; then
          echo "PASS html validation: $file"
          passed=$((passed + 1))
        else
          echo "FAIL html validation: $file"
          cat "$log_file"
          failed=$((failed + 1))
        fi
      done

      {
        echo "CHECKS_TOTAL=$total"
        echo "CHECKS_PASSED=$passed"
        echo "CHECKS_FAILED=$failed"
      } > ci-checks.env

      cat ci-checks.env

      if [ "$failed" -gt 0 ]; then
        exit 1
      fi
  artifacts:
    when: always
    reports:
      dotenv: ci-checks.env
    paths:
      - ci-checks.env
      - html-validate-*.log
    expire_in: 1 week

deploy_dev:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  needs:
    - job: ci_checks
      artifacts: true
  before_script:
    - apk add --no-cache lftp
  script:
    - |
      set +e

      deploy_target="${DEV_DEPLOY_PATH:-/dev-antondorovs/public_html/}"

      if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
        echo "DEPLOY_STATUS=missing_ftp_variables" > deploy-status.env
        echo "Missing FTP_HOST, FTP_USER, or FTP_PASSWORD"
        exit 1
      fi

      lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST" -e "
      set ftp:passive-mode true
      set ssl:verify-certificate no
      mirror -R --verbose \
        --exclude .git/ \
        --exclude .github/ \
        --exclude .gitlab-ci.yml \
        --exclude .gitattributes \
        --exclude .gitignore \
        --exclude README.md \
        --exclude ci-checks.env \
        --exclude deploy-status.env \
        --exclude html-validate-.*\\.log \
        ./ ${deploy_target}
      bye
      "
      deploy_result=$?

      if [ "$deploy_result" -eq 0 ]; then
        echo "DEPLOY_STATUS=success" > deploy-status.env
      else
        echo "DEPLOY_STATUS=failed" > deploy-status.env
      fi

      cat deploy-status.env
      exit "$deploy_result"
  artifacts:
    when: always
    reports:
      dotenv: deploy-status.env
    paths:
      - deploy-status.env
    expire_in: 1 week

telegram_notify:
  stage: notify
  image: alpine:3.20
  when: always
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  needs:
    - job: ci_checks
      artifacts: true
    - job: deploy_dev
      artifacts: true
      optional: true
  before_script:
    - apk add --no-cache curl
  script:
    - |
      if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
        echo "Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID"
        exit 1
      fi

      checks_total="${CHECKS_TOTAL:-0}"
      checks_passed="${CHECKS_PASSED:-0}"
      checks_failed="${CHECKS_FAILED:-0}"
      deploy_status="${DEPLOY_STATUS:-not_run}"

      status="success"
      icon="OK"
      if [ "$checks_failed" != "0" ]; then
        status="failed"
        icon="FAILED"
      fi

      message="$(printf '%s\n' \
        "${icon} GitLab pipeline ${status}" \
        "Project: ${CI_PROJECT_PATH}" \
        "Branch: ${CI_COMMIT_REF_NAME}" \
        "Commit: ${CI_COMMIT_SHORT_SHA}" \
        "User: ${GITLAB_USER_NAME}" \
        "Checks: ${checks_passed}/${checks_total} passed" \
        "Deploy: ${deploy_status}" \
        "Pipeline: ${CI_PIPELINE_URL}")"

      curl --fail --silent --show-error \
        --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
        --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
        --data-urlencode "text=${message}"
