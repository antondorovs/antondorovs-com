name: Deploy DEV

on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy DEV via FTP
        run: |
          lftp -u "${{ secrets.FTP_USER }}","${{ secrets.FTP_PASSWORD }}" ftp://${{ secrets.FTP_HOST }} -e "
          set ftp:passive-mode true
          set ssl:verify-certificate no
          mirror -R --parallel=5 --verbose --exclude .git/ --exclude .github/ --exclude-glob .DS_Store ./ /dev-antondorovs/public_html/
          bye
          "