name: FTP Login Test

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test raw port 21
        run: |
          timeout 10 bash -c "</dev/tcp/${{ secrets.FTP_HOST }}/21" && echo "RAW FTP PORT OPEN" || echo "RAW FTP PORT CLOSED"

      - name: Test FTP IPv4
        run: |
          curl -4 -v ftp://${{ secrets.FTP_HOST }} \
            --user "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" \
            --ftp-pasv \
            --connect-timeout 30

      - name: Test FTPS IPv4
        if: always()
        run: |
          curl -4 -v --ftp-ssl-reqd ftp://${{ secrets.FTP_HOST }} \
            --user "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" \
            --ftp-pasv \
            --connect-timeout 30